name: Tests

on:
    pull_request:
    push:
        branches: [main]

jobs:
    test:
        # Runs on NF's tablet (self-hosted runner "nf-tablet", Linux) while GitHub-hosted runners are unavailable.
        # The PC runner was blocked by Windows Application Control.
        # Only PRs from branches in this repo run here, never PRs from forks.
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        runs-on: [self-hosted, nf-tablet]
        defaults:
            run:
                shell: bash
        steps:
            - uses: actions/checkout@v4

            # Uses the python3 already installed on the tablet, in a fresh virtual environment each run
            - name: Create a virtual environment
              run: python3 -m venv .ci-venv

            - name: Install dependencies
              run: .ci-venv/bin/python -m pip install -r app_flask/requirements.txt

            - name: Run tests
              run: .ci-venv/bin/python -m unittest discover -s app_flask/tests -t . -v
