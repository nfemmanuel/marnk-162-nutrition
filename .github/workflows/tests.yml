name: Tests

on:
    pull_request:
    push:
        branches: [main]

jobs:
    test:
        # Runs on NF's PC (self-hosted runner "nf-pc") while GitHub-hosted runners are unavailable.
        # Only PRs from branches in this repo run here, never PRs from forks.
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        runs-on: [self-hosted, nf-pc]
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-python@v5
              with:
                python-version: "3.14"
            
            - name: Install dependencies
              run: pip install -r app_flask/requirements.txt

            - name: Run tests
              run: python -m unittest discover -s app_flask/tests -t . -v