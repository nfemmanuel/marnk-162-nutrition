{% extends "base.html" %}

{% block title %}Log in{% endblock %}

{% block content %}
  <h2>Log in</h2>
  <form method="post">
    <label for="email">Email</label>
    <input
      id="email"
      name="email"
      type="email"
      autocomplete="email"
      required
    >

    <label for="password">Password</label>
    <input
      id="password"
      name="password"
      type="password"
      autocomplete="current-password"
      required
    >

    <button type="submit">Log in</button>
  </form>
{% endblock %}
