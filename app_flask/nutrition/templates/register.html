{% extends "base.html" %}

{% block title %}Register{% endblock %}

{% block content %}
  <h2>Create an account</h2>
  <form method="post">
    <label for="email">Email</label>
    <input
      id="email"
      name="email"
      type="email"
      autocomplete="email"
      required
    >

    <label for="password">Password</label>
    <input
      id="password"
      name="password"
      type="password"
      minlength="8"
      autocomplete="new-password"
      required
    >

    <button type="submit">Register</button>
  </form>
{% endblock %}
